
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeria</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: #fff;
}

#galeria {
  width: 100%;
  display: flex;
  flex-direction: column;
}

#galeria img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
}
</style>
</head>

<body>

<main id="galeria"></main>

<script>
const usuario = "wilsonlourencosjc-dot";
const repositorio = "eventos";
const branch = "main";

const galeria = document.getElementById("galeria");

async function carregarImagens() {
  try {
    const url =
      `https://api.github.com/repos/${usuario}/${repositorio}/contents/?ref=${branch}`;

    const resposta = await fetch(url, {
      headers: {
        "Accept": "application/vnd.github+json"
      },
      cache: "no-store"
    });

    if (!resposta.ok) {
      throw new Error("Erro ao acessar o repositório GitHub.");
    }

    const arquivos = await resposta.json();

    const imagens = arquivos
      .filter(arquivo =>
        arquivo.type === "file" &&
        /^\d+.*\.(jpg|jpeg|png|gif|webp|avif|bmp)$/i.test(arquivo.name)
      )
      .sort((a, b) => {
        const numeroA = Number(a.name.match(/^\d+/)[0]);
        const numeroB = Number(b.name.match(/^\d+/)[0]);

        return numeroB - numeroA;
      });

    galeria.innerHTML = "";

    imagens.forEach(arquivo => {
      const img = document.createElement("img");

      img.src = arquivo.download_url;
      img.alt = "";
      img.loading = "lazy";
      img.decoding = "async";

      galeria.appendChild(img);
    });

  } catch (erro) {
    console.error("Falha ao carregar imagens:", erro);
  }
}

carregarImagens();
</script>

</body>
</html>
