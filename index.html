<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eventos</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: white;
}

#galeria {
  display: flex;
  flex-direction: column;
  width: 100%;
}

#galeria img {
  display: block;
  width: 100%;
  height: auto;
}

</style>
</head>

<body>

<main id="galeria"></main>

<script>
const usuario = "wilsonlourencosjc-dot";
const repositorio = "eventos";
const branch = "main";

const galeria = document.getElementById("galeria");

// Data de hoje no fuso horário brasileiro
const hoje = new Intl.DateTimeFormat("en-CA", {
  timeZone: "America/Sao_Paulo",
  year: "numeric",
  month: "2-digit",
  day: "2-digit"
}).format(new Date());

async function carregarImagens() {
  try {

    const url =
      `https://api.github.com/repos/${usuario}/${repositorio}/contents/?ref=${branch}`;

    const resposta = await fetch(url, {
      headers: {
        "Accept": "application/vnd.github+json"
      },
      cache: "no-store"
    });

    if (!resposta.ok) {
      throw new Error("Erro ao consultar o repositório GitHub.");
    }

    const arquivos = await resposta.json();

    // Extrai a data AAAA-MM-DD do início do nome
    function extrairData(nome) {
      const resultado = nome.match(/^(\d{4}-\d{2}-\d{2})/);
      return resultado ? resultado[1] : null;
    }

    // Filtra imagens com datas iguais ou posteriores a hoje
    const imagens = arquivos
      .filter(arquivo => {
        if (arquivo.type !== "file") return false;

        if (!/\.(jpg|jpeg|png|webp|gif|avif|bmp)$/i.test(arquivo.name))
          return false;

        const data = extrairData(arquivo.name);

        return data !== null && data >= hoje;
      })

      // Ordem cronológica crescente
      .sort((a, b) => {
        return extrairData(a.name).localeCompare(extrairData(b.name));
      });

    galeria.innerHTML = "";

    imagens.forEach(arquivo => {
      const img = document.createElement("img");

      img.src = arquivo.download_url;
      img.alt = "";
      img.loading = "lazy";
      img.decoding = "async";

      galeria.appendChild(img);
    });

  } catch (erro) {
    console.error("Erro ao carregar imagens:", erro);
  }
}

carregarImagens();
</script>

</body>
</html>
